<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Buddy 2.0 — Budgets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --accent:#0D9488; --accent-2:#14B8A6;
  --text:#334155; --muted:#94A3B8; --border:#E2E8F0;
  --income:#34D399; --expense:#F87171; --ai:#A78BFA; --warn:#F59E0B;
  --r:16px; --shadow:0 2px 10px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
}
.app{display:flex;min-height:100vh}
/* ---------- Sidebar ---------- */
.sidebar{
  width:250px;background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;gap:12px;align-items:center;padding:22px 20px;border-bottom:1px solid var(--border)}
.brand .logo{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 6px 16px rgba(13,148,136,.28);
}
.brand h1{font-size:16px;font-weight:800;letter-spacing:-.2px}
.brand span{font-size:12px;color:var(--muted);font-weight:500}
.nav{padding:16px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.nav a{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;
  background:transparent;border-radius:12px;font:inherit;font-size:15px;font-weight:600;
  color:var(--text);text-decoration:none;transition:.18s;border-left:3px solid transparent;
}
.nav a:hover{background:#F1F5F9}
.nav a.active{
  color:var(--accent);border-left-color:var(--accent);
  background:linear-gradient(90deg,rgba(13,148,136,.10),rgba(13,148,136,0));
}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--expense);margin-left:auto}
.profile{
  display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:18px 20px;border-top:1px solid var(--border);
}
.avatar{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;
  font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  flex-shrink:0;
}
.logout-btn{
  color: var(--muted); display: flex; align-items: center; justify-content: center;
  padding: 6px; border-radius: 8px; transition: 0.2s;
}
.logout-btn:hover{ color: var(--expense); background: #FEF2F2; }

/* ---------- Main ---------- */
.main{flex:1;min-width:0}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:22px 32px;border-bottom:1px solid var(--border);background:var(--card);
  position:sticky;top:0;z-index:20;
}
.topbar h2{font-size:26px;font-weight:800;letter-spacing:-.4px}
.topbar p{font-size:13px;color:var(--muted);margin-top:2px}
.synced{
  display:flex;align-items:center;gap:8px;background:#F1F5F9;color:var(--text);
  padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;
}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--income);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn{
  border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;font-size:14px;
  color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 4px 14px rgba(13,148,136,.28);transition:.18s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(13,148,136,.34)}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--border);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.content{padding:26px 32px 60px;display:flex;flex-direction:column;gap:20px}

/* ---------- Cards ---------- */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);padding:22px;transition:.2s;
}
.card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.card h3{font-size:12px;letter-spacing:1.1px;color:var(--muted);font-weight:700;text-transform:uppercase}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1.15fr .85fr}
.tile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}

/* ---------- Budgets ---------- */
.bud{padding:14px 0;border-bottom:1px solid #F1F5F9}
.bud:last-child{border-bottom:0}
.bud .r1{display:flex;align-items:center;gap:12px}
.bud b{font-size:14.5px;flex:1}
.bud .nums{color:var(--muted);font-size:13px;font-weight:600}
.bar{height:8px;border-radius:99px;background:#F1F5F9;margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.over-txt{color:var(--expense);font-size:12.5px;font-weight:600;margin-top:7px}
.badge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(3px);display:none;place-items:center;z-index:50}
.overlay.open{display:grid}
.modal{background:var(--card);border-radius:20px;width:480px;max-width:94vw;max-height:92vh;overflow:auto;padding:28px}
.modal h3{font-size:20px;text-transform:none;letter-spacing:-.3px;color:var(--text);margin-bottom:18px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:7px}
.field input,.field select{
  width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:11px;
  font:inherit;font-size:14px;background:var(--card);color:var(--text);
}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.toggle{display:flex;gap:8px;background:#F1F5F9;padding:5px;border-radius:12px;margin-bottom:18px}
.toggle button{
  flex:1;padding:10px;border:0;background:transparent;border-radius:99px;font:inherit;
  font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;transition:.16s;
}
.toggle button.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.preview{background:#F8FAFC;border:1px solid var(--border);border-radius:12px;padding:13px 15px;font-size:13.5px;font-weight:600;margin-bottom:15px}
.err{color:var(--expense);font-size:13px;font-weight:600;margin-bottom:12px;min-height:18px}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
canvas{max-width:100%}
@media(max-width:1000px){
  .g3{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .sidebar{width:76px}.brand div,.nav a span.lbl,.profile div,.logout-btn{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">&#128176;</div>
      <div><h1>Budget Buddy</h1><span>2.0 &middot; Smart Finance</span></div>
    </div>
    <nav class="nav">
      <a href="/">&#127968; <span class="lbl">Overview</span></a>
      <a href="transactions">&#8596;&#65039; <span class="lbl">Transactions</span></a>
      <a href="budgets" class="active">&#128202; <span class="lbl">Budgets</span><i class="dot" id="budDot" style="display:none"></i></a>
      <a href="goals">&#127919; <span class="lbl">Goals</span></a>
      <a href="ai-coach">&#10024; <span class="lbl">AI Coach</span></a>
    </nav>
    <div class="profile">
      <div style="display: flex; gap: 12px; align-items: center; min-width: 0;">
        <div class="avatar" id="avatar">{{ user.username[0].upper() }}</div>
        <div style="min-width: 0;">
          <b id="uname" style="font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ user.username }}</b>
          <small id="uplan" style="color: var(--muted); font-size: 12px;">Student</small>
        </div>
      </div>
      <a href="/logout" title="Đăng xuất" class="logout-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </a>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><h2>Budgets</h2><p>July 2025 &middot; All accounts synced</p></div>
      <div style="display:flex;gap:12px;align-items:center">
        <div class="synced"><i class="pulse"></i> Synced</div>
        <button class="btn" id="openModal">+ Add Transaction</button>
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<!-- Modal Thêm Giao Dịch -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Add Transaction</h3>
    <div class="toggle">
      <button id="tExp" class="on">Expense</button>
      <button id="tInc">Income</button>
    </div>
    <div class="field"><label>Merchant / Mô tả</label><input id="fMerchant" placeholder="VD: Highlands Coffee"></div>
    <div class="row2">
      <div class="field"><label>Amount (&#8363;)</label><input id="fAmount" type="number" min="0" step="1000" placeholder="45000"></div>
      <div class="field"><label>Date</label><input id="fDate" type="date"></div>
    </div>
    <div class="field"><label>Category</label><select id="fCat"></select></div>
    <div class="field"><label>Paid via / Account</label><select id="fAcc"></select></div>
    <div class="preview" id="preview"></div>
    <div class="err" id="err"></div>
    <div class="row2">
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn" id="saveBtn">Save Transaction</button>
    </div>
  </div>
</div>

<script>
/* ===== Mock Database ===== */
const SEED = {
  "accounts": [{"balance": 520000, "icon": "💵", "id": 1, "name": "Personal Wallet", "type": "cash"}, {"balance": 1450000, "icon": "🏦", "id": 2, "name": "MB Bank", "type": "bank"}, {"balance": 480000, "icon": "🏦", "id": 3, "name": "Techcombank", "type": "bank"}, {"balance": 260000, "icon": "📱", "id": 4, "name": "MoMo", "type": "ewallet"}, {"balance": 90000, "icon": "📱", "id": 5, "name": "ShopeePay", "type": "ewallet"}], 
  "budgets": [{"bg": "#FEF3C7", "category": "Food & Drinks", "category_id": 1, "color": "#B45309", "icon": "🍜", "id": 1, "limit_vnd": 600000, "over": 0, "pct": 80, "period": "2025-07", "spent": 480000}, {"bg": "#EDE9FE", "category": "Transport", "category_id": 2, "color": "#6D28D9", "icon": "🛵", "id": 2, "limit_vnd": 150000, "over": 0, "pct": 87, "period": "2025-07", "spent": 130000}, {"bg": "#FCE7F3", "category": "Entertainment", "category_id": 4, "color": "#BE185D", "icon": "🎬", "id": 3, "limit_vnd": 80000, "over": 85000, "pct": 206, "period": "2025-07", "spent": 165000}, {"bg": "#DBEAFE", "category": "Education", "category_id": 3, "color": "#1D4ED8", "icon": "📚", "id": 4, "limit_vnd": 300000, "over": 0, "pct": 86, "period": "2025-07", "spent": 257000}, {"bg": "#CCFBF1", "category": "Shopping", "category_id": 5, "color": "#0F766E", "icon": "🛍", "id": 5, "limit_vnd": 100000, "over": 59000, "pct": 159, "period": "2025-07", "spent": 159000}], 
  "categories": [{"bg": "#FEF3C7", "color": "#B45309", "icon": "🍜", "id": 1, "kind": "expense", "name": "Food & Drinks"}, {"bg": "#EDE9FE", "color": "#6D28D9", "icon": "🛵", "id": 2, "kind": "expense", "name": "Transport"}, {"bg": "#DBEAFE", "color": "#1D4ED8", "icon": "📚", "id": 3, "kind": "expense", "name": "Education"}, {"bg": "#FCE7F3", "color": "#BE185D", "icon": "🎬", "id": 4, "kind": "expense", "name": "Entertainment"}, {"bg": "#CCFBF1", "color": "#0F766E", "icon": "🛍", "id": 5, "kind": "expense", "name": "Shopping"}, {"bg": "#D1FAE5", "color": "#047857", "icon": "💼", "id": 6, "kind": "income", "name": "Income"}], 
  "transactions": [{"acc_icon": "📱", "account": "MoMo", "account_id": 4, "ai_tagged": 1, "amount": -45000, "bg": "#FEF3C7", "cat_icon": "🍜", "category": "Food & Drinks", "category_id": 1, "color": "#B45309", "created_at": "2026-07-29 09:26:45", "date": "2025-07-26", "id": 1, "merchant": "Highlands Coffee"}], 
  "user": {"initials": "{{ user.username[0].upper() }}", "name": "{{ user.username }}", "plan": "Student"}
};
const DB = {
  period: "2025-07", user: SEED.user, accounts: SEED.accounts, categories: SEED.categories,
  transactions: SEED.transactions, limits: SEED.budgets.map(b => ({category_id:b.category_id, limit_vnd:b.limit_vnd}))
};
let nextId = 100;
function buildState(){
  const P = DB.period;
  const m = DB.transactions.filter(t => t.date.indexOf(P) === 0);
  const budgets = DB.limits.map(l => {
    const c = DB.categories.find(x => x.id === l.category_id);
    const spent = -m.filter(t => t.category_id === l.category_id && t.amount < 0).reduce((s,t) => s + t.amount, 0);
    return {category_id:l.category_id, limit_vnd:l.limit_vnd, category:c.name, icon:c.icon, color:c.color, bg:c.bg, spent:spent, pct: Math.round(spent / l.limit_vnd * 100), over: Math.max(0, spent - l.limit_vnd)};
  });
  const weekly = [344000, 225000, 295000, 327000];
  return {period:P, user:DB.user, accounts:DB.accounts, categories:DB.categories, budgets:budgets, charts:{weekly:weekly}};
}
function reply(obj, ok){ return Promise.resolve({ok: ok !== false, json: () => Promise.resolve(obj)}); }
window.fetch = function(url, opts){
  opts = opts || {}; const body = opts.body ? JSON.parse(opts.body) : {};
  if(url === '/api/state') return reply(buildState());
  if(url === '/api/transactions' && opts.method === 'POST'){
    const acc = DB.accounts.find(a => a.id === body.account_id);
    const cat = DB.categories.find(c => c.id === body.category_id);
    const amt = Math.round(Number(body.amount));
    if(!acc || !cat || !(amt > 0)) return reply({error:'Dữ liệu không hợp lệ'}, false);
    const signed = body.type === 'income' ? amt : -amt;
    acc.balance += signed;
    DB.transactions.push({id: nextId++, merchant: body.merchant, amount: signed, date: body.date, category_id: cat.id, account_id: acc.id, category: cat.name, cat_icon: cat.icon, color: cat.color, bg: cat.bg, account: acc.name, acc_icon: acc.icon});
    return reply(buildState());
  }
  return reply({error:'404'}, false);
};

/* ===== UI Script ===== */
const $ = s => document.querySelector(s);
let S = null, txnType = 'expense', charts = [];
const fmtVND = n => { const a = Math.abs(n); return a >= 1e6 ? (n/1e6).toFixed(1).replace('.0','') + 'M' : Math.round(n/1e3) + 'K'; };
const money = n => fmtVND(n) + ' ₫';
const full  = n => n.toLocaleString('vi-VN') + ' ₫';
const esc   = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  const r = await fetch('/api/state'); S = await r.json(); render();
}

function render(){
  if(!S) return;
  charts.forEach(c => c.destroy()); charts = [];
  $('#uname').textContent = S.user.name; $('#uplan').textContent = S.user.plan; $('#avatar').textContent = S.user.initials;
  $('#budDot').style.display = S.budgets.some(b => b.over > 0) ? 'block' : 'none';
  
  const total = S.budgets.reduce((s,b) => s + b.limit_vnd, 0);
  const spent = S.budgets.reduce((s,b) => s + b.spent, 0);
  const cards = [
    ['TOTAL BUDGET','&#128179;','#DBEAFE','#1D4ED8', money(total)],
    ['TOTAL SPENT','&#128184;','#FEF3C7','#B45309', money(spent)],
    ['REMAINING','&#128994;','#D1FAE5','#059669', money(total-spent)],
  ].map(c => `<div class="card" style="display:flex;gap:14px;align-items:center">
      <div class="tile" style="background:${c[2]}">${c[1]}</div>
      <div><h3>${c[0]}</h3><div style="font-size:24px;font-weight:800;color:${c[3]}">${c[4]}</div></div>
    </div>`).join('');
    
  const bars = S.budgets.map(b => {
    const col = b.over > 0 ? '#F87171' : b.pct >= 80 ? '#F59E0B' : '#34D399';
    return `<div class="bud">
      <div class="r1">
        <div class="tile" style="background:${b.bg}">${b.icon}</div>
        <b>${esc(b.category)}</b>
        <span class="nums">${fmtVND(b.spent)} / ${fmtVND(b.limit_vnd)}</span>
        <span class="badge" style="background:${b.over>0?'#FEE2E2':'#F1F5F9'};color:${b.over>0?'#DC2626':col}">
          ${b.over>0?'OVER':b.pct+'%'}</span>
      </div>
      <div class="bar"><i style="width:${Math.min(100,b.pct)}%;background:${col}"></i></div>
      ${b.over>0?`<div class="over-txt">Over by ${full(b.over)}</div>`:''}
    </div>`;
  }).join('');
  
  const worst = S.budgets.slice().sort((a,b) => b.pct - a.pct)[0];
  
  $('#view').innerHTML = `<div class="grid g3">${cards}</div>
  <div class="grid g2">
    <div class="card"><h3>Category limits &middot; ${S.period}</h3>${bars}</div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card"><h3>Weekly Spend</h3><canvas id="bars" height="200"></canvas></div>
      <div class="card" style="background:#F5F3FF;border-color:#DDD6FE">
        <div style="display:flex;gap:12px;align-items:flex-start">
          <div class="tile" style="background:#EDE9FE">&#10024;</div>
          <div><h3 style="color:#7C3AED">AI Insight</h3>
          <p style="font-size:14px;line-height:1.6;margin-top:8px">
          ${worst ? `<b>${esc(worst.category)}</b> đang ở mức <b>${worst.pct}%</b> ngân sách.
          ${worst.over>0 ? 'Bạn đã vượt giới hạn — hãy tạm dừng chi mục này đến cuối tháng.' : 'Vẫn nằm trong kiểm soát, tiếp tục giữ nhịp nhé!'}` : ''}
          </p></div>
        </div>
      </div>
    </div>
  </div>`;
  
  const barsCanvas = $('#bars');
  if(barsCanvas){
    const w = S.charts.weekly; const mx = Math.max(...w);
    charts.push(new Chart(barsCanvas, {
      type:'bar', data:{labels:['Wk 1','Wk 2','Wk 3','Wk 4'], datasets:[{data:w, backgroundColor:w.map(v => v===mx?'#F87171':'#2DA89C'), borderRadius:6, barThickness:36}]},
      options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,grid:{color:'#F1F5F9'},ticks:{callback:v=>fmtVND(v),color:'#94A3B8'}}, x:{grid:{display:false},ticks:{color:'#94A3B8'}}}}
    }));
  }
}

/* Modal Actions */
function openModal(){
  $('#fDate').value = S.period + '-' + String(new Date().getDate()).padStart(2,'0');
  $('#fMerchant').value = ''; $('#fAmount').value = ''; $('#err').textContent = '';
  setType('expense'); $('#overlay').classList.add('open'); $('#fMerchant').focus();
}
function closeModal(){ $('#overlay').classList.remove('open'); }
function setType(t){
  txnType = t; $('#tExp').classList.toggle('on', t === 'expense'); $('#tInc').classList.toggle('on', t === 'income');
  const cats = S.categories.filter(c => c.kind === txnType);
  $('#fCat').innerHTML = cats.map(c => `<option value="${c.id}">${c.icon} ${esc(c.name)}</option>`).join('');
  $('#fAcc').innerHTML = S.accounts.map(a => `<option value="${a.id}">${a.icon} ${esc(a.name)} — ${full(a.balance)}</option>`).join('');
  updatePreview();
}
function updatePreview(){
  const acc = S.accounts.find(a => a.id == $('#fAcc').value);
  const amt = parseInt($('#fAmount').value || 0, 10);
  if(!acc){ $('#preview').textContent = ''; return; }
  const after = acc.balance + (txnType === 'income' ? amt : -amt);
  $('#preview').innerHTML = `Số dư <b>${esc(acc.name)}</b> sau giao dịch: <b style="color:${after < 0 ? '#DC2626' : '#059669'}">${full(after)}</b>`;
}

$('#openModal').onclick = openModal;
$('#cancelBtn').onclick = closeModal;
$('#tExp').onclick = () => setType('expense');
$('#tInc').onclick = () => setType('income');
$('#fAcc').onchange = updatePreview;
$('#fAmount').oninput = updatePreview;
$('#overlay').onclick = e => { if(e.target === $('#overlay')) closeModal(); };
$('#saveBtn').onclick = async () => {
  try{
